<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Удалённый сервер</title>
    <style>
      body { margin: 0; padding: 20px; background: #0a1020; color: #e9eefb; font: 14px/1.4 'Segoe UI', sans-serif; }
      h1 { font-size: 16px; margin: 0 0 6px; }
      p { margin: 0 0 12px; color: #8f9cbf; }
      input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 15px; color: #e9eefb; background: #1a2442; border: 1px solid #27335a; border-radius: 10px; outline: none; }
      input:focus { border-color: #6ea8ff; }
      .row { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
      button { padding: 9px 16px; font-size: 14px; border-radius: 10px; border: 1px solid #27335a; background: #1a2442; color: #e9eefb; cursor: pointer; }
      button.primary { background: #6ea8ff; border-color: #6ea8ff; color: #04122b; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Подключиться к удалённому серверу</h1>
    <p>Адрес вашего сервера Polaris (например, на Render). Вход — по паролю инстанса.</p>
    <input id="url" placeholder="https://polaris-xxxx.onrender.com" autofocus />
    <div class="row">
      <button id="cancel">Отмена</button>
      <button id="ok" class="primary">Подключиться</button>
    </div>
    <script>
      const input = document.getElementById('url');
      input.value = new URLSearchParams(location.search).get('value') || '';
      const submit = () => window.promptApi.submit(input.value.trim());
      document.getElementById('ok').onclick = submit;
      document.getElementById('cancel').onclick = () => window.promptApi.cancel();
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); if (e.key === 'Escape') window.promptApi.cancel(); });
    </script>
  </body>
</html>
