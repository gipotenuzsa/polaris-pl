# Windows-приложение (.exe): локальный сервер Polaris + интерфейс в одном окне.
# Запускается вручную или при теге v*: Actions → Windows (.exe) → Run workflow.
name: Windows (.exe)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: desktop
      - name: Скачать бинарник Electron (npm 11 не выполняет install-скрипты без разрешения)
        run: node node_modules/electron/install.js
        working-directory: desktop
      - name: Собрать .exe
        run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Polaris-windows
          path: |
            desktop/release/*.exe
          if-no-files-found: error
