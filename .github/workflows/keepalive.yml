# Не даёт бесплатному Render «заснуть» и запускает планировщик (задачи, напоминания, сводка), пока сервер без другого пинга.
# Нужны секреты репозитория: POLARIS_URL (https://….onrender.com) и CRON_SECRET (как на сервере).
# GitHub запускает расписание с задержкой в несколько минут — точный пинг даёт pg_cron в Supabase
# (supabase/optional/pg_cron_jobs.sql); при его настройке этот workflow можно отключить.
name: Keep alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.KEEPALIVE_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health и /internal/tick
        env:
          POLARIS_URL: ${{ secrets.POLARIS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$POLARIS_URL" ]; then echo "POLARIS_URL не задан — пропускаю"; exit 0; fi
          curl -fsS --retry 5 --retry-delay 20 --max-time 90 "$POLARIS_URL/health"
          echo
          if [ -n "$CRON_SECRET" ]; then
            curl -fsS --max-time 90 -X POST -H "x-cron-secret: $CRON_SECRET" "$POLARIS_URL/internal/tick"
            echo
          fi
