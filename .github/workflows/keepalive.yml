# Будит бесплатный Render, если он всё же уснул (после пробуждения сервер сам держит себя «живым» самопингом),
# и запускает планировщик (задачи, напоминания, сводка). Секреты не обязательны:
#  - адрес берётся из секрета POLARIS_URL, а если его нет — из переменной репозитория POLARIS_URL или значения ниже;
#  - CRON_SECRET (как на сервере) нужен только для внешнего запуска /internal/tick; без него пинг просто будит сервис.
# GitHub запускает расписание с задержкой в несколько минут — точный пинг даёт pg_cron в Supabase
# (supabase/optional/pg_cron_jobs.sql); при его настройке этот workflow можно отключить (переменная KEEPALIVE_ENABLED=false).
name: Keep alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.KEEPALIVE_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health и /internal/tick
        env:
          POLARIS_URL: ${{ secrets.POLARIS_URL || vars.POLARIS_URL || 'https://polaris-pl.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --retry 5 --retry-delay 20 --max-time 120 "$POLARIS_URL/health"
          echo
          if [ -n "$CRON_SECRET" ]; then
            curl -fsS --max-time 90 -X POST -H "x-cron-secret: $CRON_SECRET" "$POLARIS_URL/internal/tick"
            echo
          fi
